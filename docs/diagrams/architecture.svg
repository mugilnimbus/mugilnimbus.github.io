<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc"><title id="title">Portfolio architecture</title><desc id="desc">The static host serves a browser application. Visitors control its journey and can navigate to external GitHub repositories. Rendering has no tool execution authority.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#d8c59f"/></marker></defs><rect width="1000" height="220" rx="16" fill="#101923"/><g fill="#17232d" stroke="#9b8d79"><rect x="25" y="65" width="205" height="90" rx="13"/><rect x="395" y="65" width="230" height="90" rx="13"/><rect x="790" y="65" width="185" height="90" rx="13"/></g><g font-family="Segoe UI, sans-serif" text-anchor="middle" fill="#faf4e9"><text x="128" y="97" font-size="18">Static host</text><text x="128" y="124" font-size="13">Read-only public files</text><text x="510" y="97" font-size="18">Browser portfolio</text><text x="510" y="124" font-size="13">Series player, timing, line drawings</text><text x="882" y="97" font-size="18">GitHub</text><text x="882" y="124" font-size="13">Public project evidence</text><text x="510" y="36" font-size="14">Visitor: watch · click · keyboard</text><text x="510" y="196" font-size="13">No models, desktop tools, database, or backend writes</text></g><g stroke="#d8c59f" fill="none" marker-end="url(#arrow)"><path d="M230 110H395"/><path d="M625 110H790"/></g><g fill="#ddd5c7" font-family="Segoe UI, sans-serif" text-anchor="middle" font-size="12"><text x="312" y="97">HTTP GET</text><text x="706" y="97">HTTPS navigation</text></g></svg>
